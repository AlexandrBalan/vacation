<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Dream Vacation</title>
    <link rel="icon" href="/images/plane.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main class="card">
    <div class="banner-wrap">
      <img class="banner" src="/images/sunset.jpg" alt="Sunset over a beach">
      <h1>Book Your Dream Vacation</h1>
    </div>



    
    <form id="vacation-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="destination">Destination</label>
          <select id="destination" name="destination">
            <option value="">Choose a destination</option>
            <option value="Bali, Indonesia">Bali, Indonesia</option>
            <option value="Paris, France">Paris, France</option>
            <option value="Tokyo, Japan">Tokyo, Japan</option>
            <option value="Maldives">Maldives</option>
            <option value="New York City, USA">New York City, USA</option>
          </select>
          <span class="error" id="destination-error"></span>
        </div>

        <div class="field third">
          <label for="departure">Departure Date</label>
          <input type="date" id="departure" name="departure">
          <span class="error" id="departure-error"></span>
        </div>

        <div class="field third">
          <label for="travelers">Number of Travelers</label>
          <input type="number" id="travelers" name="travelers" min="1" max="20">
          <span class="error" id="travelers-error"></span>
        </div>
      </div>

      <button type="submit">Find My Vacation</button>
      <p class="success" id="success-message"></p>
    </form>
  </main>
  <script src="/scripts/script.js"></script>
</body>
</html>
